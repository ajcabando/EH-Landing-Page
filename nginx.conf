server {
  listen 80;
  server_name _;
  absolute_redirect off;

  # Backwards compatibility: old /EH/... URLs now live at the root (/...)
  location = /EH {
    return 301 /;
  }
  location /EH/ {
    rewrite ^/EH/(.*)$ /$1 permanent;
  }

  # Serve the site at the root path
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ =404;
  }
}
